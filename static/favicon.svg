<!--
	The home header's geometry as a mark: rings struck from off centre so they crop at the edges the
	way the header's arcs do, in the app's bronze and gold rather than the regulated face colours,
	which belong to scores and not to branding.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
	<rect width="1024" height="1024" fill="#f7f3ec" />
	<g fill="none" stroke-width="82">
		<circle cx="580" cy="452" r="470" stroke="#eed5a4" />
		<circle cx="580" cy="452" r="352" stroke="#e0b567" />
		<circle cx="580" cy="452" r="234" stroke="#d0912f" />
	</g>
	<circle cx="580" cy="452" r="124" fill="#8a5320" />
</svg>
