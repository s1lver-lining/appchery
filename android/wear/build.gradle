apply plugin: 'com.android.application'

// Framework APIs and two small androidx libraries, no Compose: the UI is built in code and stays
// that way, so the app is a few hundred kilobytes on a device that has very little.
android {
    namespace "com.appchery.watch"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.appchery.watch"
        // Wear OS 3, the oldest release that still gets the current Play Services.
        minSdkVersion 30
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "0.1"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    /*
     * The one thing the framework cannot do on a watch. A foreground service must show a
     * notification, and on Wear a newly posted notification buzzes the wrist however quiet its
     * channel is: measured on the device, with the channel at minimum importance, sound and
     * vibration explicitly off, and `isNoisy=false` in the notification service's own dump. An
     * ongoing activity is the supported answer — the same service, shown as a chip on the watch
     * face rather than as news arriving in the stream.
     */
    implementation 'androidx.wear:wear-ongoing:1.0.0'
    // NotificationCompat, which OngoingActivity is built on.
    implementation 'androidx.core:core:1.13.1'
    /*
     * Ambient mode, which is the only way a screen stays up on a watch without staying lit. There is
     * no framework call for it: the platform grants it through this library, which is also why the
     * activity is a ComponentActivity rather than a plain one.
     */
    implementation 'androidx.wear:wear:1.3.0'
    implementation 'androidx.activity:activity:1.9.3'
    /*
     * One Kotlin standard library, not three. wear:1.3.0 asks for the old jdk7 and jdk8 splits,
     * which were folded into the main artifact at 1.8 and now collide with it class for class.
     */
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
}
