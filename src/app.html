<!doctype html>
<html lang="en" class="h-full">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<!--
			Both schemes are painted by hand, which is what turns a browser's own forced dark mode off.
			It belongs here rather than only in the stylesheet: Samsung Internet decides whether to
			repaint the page while the head is being read, and a page it judges light-only comes back
			with its colours rewritten, brand gold arriving as red.
		-->
		<meta name="color-scheme" content="light dark" />
		<!--
			One tag, kept in step by $lib/theme, rather than a pair keyed to prefers-color-scheme. The
			media form follows the system, but the app has a theme of its own, so choosing Dark on a
			light phone used to leave a pale status bar over a dark app. The value here is only what
			shows before the script runs, and it is the header's colour rather than the page's: on
			Android the status bar sits directly above the header, and any difference reads as a band.
		-->
		<meta name="theme-color" content="#f3e9d9" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icon-192.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="tap" class="h-full">
		<div id="app" class="h-full">%sveltekit.body%</div>
	</body>
</html>
