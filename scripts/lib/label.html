	 * The one place that answers it, because everything else has to agree: what is drawn, what a click
	 * lands on, which arrows still want a nock, and what the training set is told. Keyed by the arrow's
	 * number rather than by position in a list, so a frame carrying only arrow four is describing arrow
	 * four and not a first arrow that happens to be fourth.
	 */
	function arrowsHere(h) {
		const v = video();
		const own = v.frameArrows?.[frame] ?? [];
		const places = new Map();
		if (own.length > 0) {
			for (const arrow of own) places.set(arrow.n, project(h, arrow.x, arrow.y));
			return { places, derived: false, own };
		}
		v.arrows.forEach((arrow, i) => places.set(i, project(h, arrow.x, arrow.y)));
		// Not derived on the frame they were drawn on: there they are exactly where somebody put them.
		return { places, derived: v.arrowFrame !== frame, own: null };
	}

	/**
	 * The four handles walked round a fixed ring, so the one being dragged sits nearest the pointer.
	 *
	 * They stay a quarter turn apart, which is what keeps the projection identical: four points at the
	 * angles the fit assumes, on the conic the fit already describes, define that same fit again. Let
	 * them move independently and they would not, because a projection is fixed by four correspondences
	 * and points slid to angles it does not know about describe a different one.
	 */
	function turnedHandles(fit, grabbed, p) {
		const r = anchorRadius();
		const on = (t) => project(fit, Math.cos(t) * r, Math.sin(t) * r);
		const miss = (t) => {
			const q = on(t);
			return Math.hypot(q.x - p.x, q.y - p.y);
		};

		// Coarse over the whole ring, then bisected: the pointer can be anywhere and there is no start.
		let best = 0;
		let bestMiss = Infinity;
		for (let i = 0; i < 180; i++) {
			const t = (i / 180) * Math.PI * 2;
			const value = miss(t);
			if (value < bestMiss) {
				bestMiss = value;
				best = t;
			}
		}
		for (let step = Math.PI / 180; step > 1e-5; step /= 3) {
			for (const way of [step, -step]) {
				let improved = true;
				while (improved) {
					improved = false;
					const value = miss(best + way);
					if (value < bestMiss - 1e-12) {
						best += way;
						bestMiss = value;
						improved = true;
					}
				}
			}
		}

		return [0, 1, 2, 3].map((i) => {
			const q = on(best + ((i - grabbed) * Math.PI) / 2);
			return [q.x, q.y];
		});
	}

	/** The lowest arrow number this frame has not placed yet, so six clicks in a row number one to six. */
	function nextNumber() {
		const own = video().frameArrows?.[frame] ?? [];
		for (let i = 0; ; i++) if (!own.some((arrow) => arrow.n === i)) return i;
	}

	/**
	 * Takes an arrow out of the recording, and everything that was pointing at it with it.
	 *
	 * An arrow is identified by its place in the list, which is also the number drawn beside it, so
	 * taking one out of the middle moves every arrow after it down one. Nocks are stored against that
	 * number, in the picture's own pixels, so a splice on its own left every nock past the gap pointing
	 * one arrow too high: the nocks stayed exactly where they were placed and quietly became somebody
	 * else's. That is invisible until the frame is drawn again, which is why it looked like a fault that
	 * appeared on coming back to a frame rather than on the click that caused it.
	 */
	function removeArrow(at) {
		const v = video();
		v.arrows.splice(at, 1);
		for (const [where, list] of Object.entries(v.nocks)) {
			// The nocks of the arrow that has gone go with it; a nock to nothing is not evidence.
			v.nocks[where] = list.filter((nock) => nock.arrow !== at).map((nock) =>
				nock.arrow > at ? { ...nock, arrow: nock.arrow - 1 } : nock
			);
		}
		// A frame's own arrows are numbered the same way, so they move down with everything else.
		for (const [where, list] of Object.entries(v.frameArrows ?? {})) {
			const kept = list.filter((arrow) => arrow.n !== at).map((arrow) =>
				arrow.n > at ? { ...arrow, n: arrow.n - 1 } : arrow
			);
			if (kept.length > 0) v.frameArrows[where] = kept;
			else delete v.frameArrows[where];
		}
		if (nocking >= v.arrows.length) nocking = Math.max(0, v.arrows.length - 1);
	}

	/** The arrow numbers this frame shows, placed here or read off another frame, lowest first. */
	function numbersHere() {
		const v = video();
		if (!v) return [];
		const own = v.frameArrows?.[frame] ?? [];
		if (own.length > 0) return own.map((arrow) => arrow.n).sort((a, b) => a - b);
		return v.arrows.map((_, i) => i);
	}

	/** The lowest numbered arrow with no nock on this frame yet, or -1 when they all have one. */
	function waiting() {
		const here = video()?.nocks?.[frame] ?? [];
		for (const n of numbersHere()) {
			if (!here.some((nock) => nock.arrow === n)) return n;
		}
		return -1;
	}

	view.onpointermove = (event) => {
		if (!panning && source === 'photos') return;
		if (panning) {
			const box = view.getBoundingClientRect();
			const k = zoom * closer;
			lookX = panning.lookX - ((event.clientX - panning.x) / box.width) * view.width / k;
			lookY = panning.lookY - ((event.clientY - panning.y) / box.height) * view.height / k;
			draw();
			return;
		}
		if (dragging < 0) return;
		const p = at(event);
		// Where the handle should be, which is where the pointer is plus wherever inside the dot it was
		// taken hold of. Locked, the same point is what the handle is walked round the ring towards.
		const aim = { x: p.x + grabOffset[0], y: p.y + grabOffset[1] };
		if (lockRotation && lockedFit) {
			state().handles = turnedHandles(lockedFit, dragging, aim);
		} else {
			state().handles[dragging] = [aim.x, aim.y];
		}
		draw();
	};

	view.onpointerup = () => {
		if (panning) {
			panning = null;
			view.className = '';
			return;
		}
		// A fit only becomes ground truth once it has been moved: the seed is a guess, not a label.
		if (dragging >= 0) {
			state().touched = true;
			changed();
		}
		lockedFit = null;
		grabOffset = [0, 0];
		dragging = -1;
		draw();
	};

	/** Raised while the timeline is being dragged, so playback does not fight the hand holding it. */
	let seeking = false;

	el('closePlayer').onclick = () => closePlayer();
	el('playPause').onclick = () => setPlaying(!playing);
	el('seek').oninput = () => {
		seeking = true;
		const span = filmSpan();
		if (span > 0) el('film').currentTime = (Number(el('seek').value) / 1000) * span;
	};
	el('seek').onchange = () => {
		seeking = false;
		/*
		 * Everything the scanner knows it learnt from the frames before this one, so a jump has to start
		 * it again. Kept where it was, a sweep dragged back to the beginning would go on showing arrows
		 * gathered from a part of the recording that has not been played yet.
		 */
		restartReplay();
	};
	el('speed').onchange = () => {
		playSpeed = Number(el('speed').value) || 1;
		el('film').playbackRate = playSpeed;
	};
	el('scorerToggle').onclick = () => {
		el(detector === 'off' ? 'detClassical' : 'detOff').onclick();
		if (detector !== 'off') restartReplay();
		if (detector === 'off') el('scorerToggle').textContent = 'Scorer off';
	};

	el('fitLock').onclick = () => {
		lockRotation = !lockRotation;
		// Turning it on is a way of placing the face, so it says so by going there.
		if (lockRotation) mode = 'fit';
		draw();
	};
	el('fitMode').onclick = () => {
		mode = 'fit';
		draw();
	};
	el('nockMode').onclick = () => {
		mode = 'nocks';
		const next = waiting();
		nocking = next >= 0 ? next : 0;
		draw();
	};
	el('markMode').onclick = () => {
		mode = 'marks';
		draw();
	};
	/**
	 * Re-reads the arrows against this frame instead of the one they were placed on.
	 *
	 * Only ever on purpose. The arrows are one set of coordinates read through one frame's fit, and which
	 * frame that is decides where every one of them lands; changing it is a decision about the whole
	 * recording, not a side effect of correcting one of them.
	 */
	el('ownArrows').onclick = () => {
		const v = video();
		if (!v.frameArrows?.[frame]) return;
		delete v.frameArrows[frame];
		changed();
		draw();
	};
	el('anchor').onclick = () => {
		const v = video();
		v.arrowFrame = frame;
		changed();
		draw();
	};
	el('in').onclick = () => lookCloser(1.4, null);
	el('out').onclick = () => lookCloser(1 / 1.4, null);
	el('wide').onclick = () => {
		closer = 1;
		lookX = 0;
		lookY = 0;
		draw();
	};
	el('hide').onclick = () => {
		showNocks = !showNocks;
		draw();
	};
	el('clearNocks').onclick = () => {
		video().nocks[frame] = [];
		changed();
		draw();
	};
	el('arrowMode').onclick = () => {
		mode = 'arrows';
		draw();
	};
	el('prev').onclick = () => {
		if (source === 'photos') photo = Math.max(0, photo - 1);
		else frame = Math.max(0, frame - 1);
		show();
	};
	el('next').onclick = () => {
		if (source === 'photos') photo = Math.min(shownPhotos().length - 1, photo + 1);
		else frame = Math.min(video().samples.length - 1, frame + 1);
		show();
	};
	el('reset').onclick = () => {
		const v = video();
		state().handles = seedHandles(v.seeds[frame], v.width, v.height);
		state().skip = false;
		state().touched = false;
		changed();
		draw();
	};
	el('copy').onclick = () => {
		if (frame === 0) return;
		const from = video().work[frame - 1];
		state().handles = from.handles.map((p) => [...p]);
		state().skip = false;
		state().touched = from.touched;
		changed();
		draw();
	};
	el('noface').onclick = () => {
		state().skip = !state().skip;
		changed();
		draw();
	};
	el('noarrows').onclick = () => {
		video().empty = !video().empty;
		while (video().empty && video().arrows.length > 0) removeArrow(video().arrows.length - 1);
		changed();
		draw();
	};
	el('undo').onclick = () => {
		if (video().arrows.length > 0) removeArrow(video().arrows.length - 1);
		changed();
		draw();
	};
	el('clear').onclick = () => {
		// Emptied one at a time, so the nocks of each go with it rather than being left pointing at gaps.
		while (video().arrows.length > 0) removeArrow(video().arrows.length - 1);
		changed();
		draw();
	};

	/** Everything about the current recording that belongs on disk. */
	function body(v) {
		return {
			arrows: v.arrows,
			nocks: v.nocks,
			marks: v.marks,
			empty: v.empty,
			faceType: v.faceType ?? null,
			// Only the frames somebody actually placed arrows on, for the same reason the fits are.
			frameArrows: Object.fromEntries(
				Object.entries(v.frameArrows ?? {}).filter(([, list]) => list.length > 0)
			),
			arrowFrame: v.arrowFrame ?? null,
			// Only the frames somebody placed or dismissed. An untouched fit is not a label, it is a guess,
			// and storing it means a better guess can never replace it.
			frames: Object.fromEntries(
				v.work
					.map((w, i) => [i, w])
					.filter(([, w]) => w.touched || w.skip)
					.map(([i, w]) => [i, { handles: w.handles, skip: w.skip, touched: w.touched }])
			)
		};
	}

	/**
	 * Writes the recording to disk shortly after it last changed.
	 *
	 * There is no save button, and that is the point rather than a convenience. Labelling is hundreds of
	 * small judgements and the only failure that matters is losing them: a press that was never made is
	 * indistinguishable from an afternoon's work, and the tool used to ask for one per recording while
	 * offering fifteen frames and four kinds of label to move between. Nothing here is expensive enough
	 * to be worth deciding about — the file is a few kilobytes and the disk is this machine's.
	 *
	 * Held for a moment rather than written on the instant, because a handle being dragged changes the
	 * label on every pointer event and the frames between two of them are not worth a write each.
	 */
	let pendingSave = 0;
	let saving = false;
	let saveAgain = false;
	/** Started this way, so nothing is written before the server has been asked whether it may be. */
	let readOnly = true;

	function changed() {
		const v = video();
		if (!v) return;
		if (readOnly) {
			// Said every time, because the alternative is an afternoon of labelling that went nowhere.
			el('saved').textContent = 'Read only: not saved';
			el('saved').className = 'saved bad';
			return;
		}
		v.dirty = true;
		clearTimeout(pendingSave);
		pendingSave = setTimeout(() => void writeNow(v), 400);
	}

	async function writeNow(v) {
		if (!v?.dirty) return;
		// One write at a time, and one more afterwards if anything moved while it was in flight.
		if (saving) {
			saveAgain = true;
			return;
		}
		saving = true;
		v.dirty = false;
		const sent = body(v);
		try {
			await fetch(`/labels/${encodeURIComponent(v.video)}`, {
				method: 'POST',
				body: JSON.stringify(sent)
			});
			v.labels = sent;
			// Now, not when the edit was made: what the list reports is what actually reached the disk.
			drawList();
			el('saved').textContent = 'Saved';
			el('saved').className = 'saved on';
		} catch (error) {
			// Said out loud and left dirty, because a label that did not reach the disk is the one failure
			// this tool has, and a quiet one would be discovered a session later.
			v.dirty = true;
			el('saved').textContent = `Not saved: ${error}`;
			el('saved').className = 'saved bad';
		} finally {
			saving = false;
			if (saveAgain) {
				saveAgain = false;
				void writeNow(v);
			}
		}
	}

	/** Written before the tab goes, for the one case the timer cannot cover. */
	window.addEventListener('beforeunload', () => {
		const v = video();
		if (!v?.dirty || readOnly) return;
		navigator.sendBeacon(`/labels/${encodeURIComponent(v.video)}`, JSON.stringify(body(v)));
	});

	/** Held, so the whole picture can be dragged with the button that also places labels. */
	let spaceDown = false;
	window.addEventListener('keyup', (event) => {
		if (event.code === 'Space') spaceDown = false;
	});

	window.onkeydown = (event) => {
		if (event.code === 'Space') {
			// The player has the picture, so the space bar has the transport rather than the pan.
			if (!el('player').hidden) {
				event.preventDefault();
				setPlaying(!playing);
				return;
			}
			spaceDown = true;
			event.preventDefault();
		}
		if (!el('player').hidden && event.key === 'Escape') return closePlayer();
		// The filter box is a text field: every letter in it is a letter, not a shortcut.
		if (event.target.tagName === 'INPUT' || event.target.tagName === 'SELECT') return;
		if (event.key === 'ArrowRight') el('next').onclick();
		if (event.key === 'ArrowLeft') el('prev').onclick();
		if (source !== 'photos') {
			if (event.key.toLowerCase() === 'f') el('fitMode').onclick();
			if (event.key.toLowerCase() === 'a') el('arrowMode').onclick();
			if (event.key.toLowerCase() === 'n') el('nockMode').onclick();
			if (event.key.toLowerCase() === 'm') el('markMode').onclick();
		}
		if (event.key.toLowerCase() === 'h') el('hide').onclick();
		// Round the three, because the useful thing is flicking between them on one picture.
		if (event.key.toLowerCase() === 'd') {
			el(detector === 'off' ? 'detClassical' : detector === 'classical' ? 'detLearned' : 'detOff').onclick();
		}
		if (event.key === '+' || event.key === '=') el('in').onclick();
		if (event.key === '-') el('out').onclick();
		if (event.key === '0') el('wide').onclick();
		if (mode === 'nocks' && /^[1-9]$/.test(event.key)) {
			const which = Number(event.key) - 1;
			if (video().arrows[which]) {
				nocking = which;
				draw();
			}
		}
	};
	window.onresize = () => show();

	try {
		readOnly = (await (await fetch('/readonly')).json()).readOnly;
	} catch {
		// Left read only, which is the safe answer, and said out loud rather than guessed at silently.
		readOnly = true;
	}
	if (readOnly) {
		el('saved').textContent = 'Read only';
		el('saved').className = 'saved bad';
	}

	if (videos.length > 0) load(0);
</script>
