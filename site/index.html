<!doctype html>
<html lang="en" class="h-full">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- Both schemes are painted by hand, which is what turns a browser's own forced dark mode off. -->
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" content="#f3e9d9" />
		<title>Appchery · Archery Scoring &amp; Training</title>
		<meta
			name="description"
			content="Score, tune and train, on your own phone. Appchery keeps every arrow on the device that shot it, works with no signal, and costs nothing."
		/>
		<link rel="icon" href="/favicon.svg" />
		<link rel="canonical" href="https://appchery.com/" />
		<!-- The share card. Written out here so the shell is a complete page on its own; the
			prerender rewrites the title, description, url and locale for each language. -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Appchery" />
		<meta property="og:title" content="Appchery" />
		<meta property="og:description" content="Archery scoring, tuning and training. Offline, free, open source." />
		<meta property="og:url" content="https://appchery.com/" />
		<meta property="og:locale" content="en" />
		<meta property="og:image" content="https://appchery.com/og.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="Appchery: everything you did on the shooting line, in one place." />
		<meta name="twitter:card" content="summary_large_image" />
	</head>
	<body class="h-full">
		<div id="site"></div>
		<script type="module" src="./main.ts"></script>
	</body>
</html>
